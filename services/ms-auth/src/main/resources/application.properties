spring.application.name=ms-auth

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ms_auth}
spring.datasource.username=${DB_USER:ms_auth_user}
spring.datasource.password=${DB_PASSWORD:ms_auth_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
